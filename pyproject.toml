[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexos-output2odms"
version = "0.1.0"
description = "PLEXOS optimized dispatch to PSS ODMS CIM17 SSH snapshot adapter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ODMS Integration Project"}]
dependencies = []

[project.optional-dependencies]
solution-zip = ["plexosdb>=1.6.1"]
test = ["pytest>=8"]

[project.scripts]
plexos-output2odms = "plexos_output2odms.cli:main"

[tool.setuptools.packages.find]
include = ["plexos_output2odms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
